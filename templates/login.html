
<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Login – Navoras</title>
</head>
<body>
  <h1>Login til Navoras</h1>
  {% if fejl %}<p style="color:red;">{{ fejl }}</p>{% endif %}
  <form method="post">
    Brugernavn: <input name="username"><br>
    Kodeord: <input name="password" type="password"><br>
    <button type="submit">Log ind</button>
  </form>
</body>
</html>
