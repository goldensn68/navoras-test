<form method='post'>

  <input name='navn' placeholder='F.eks. Havmågen'><br>
  <label>Motor:</label><br>
  <input name='motor' placeholder='F.eks. Yanmar 30HK'><br><br>
  <button>Gem</button>
</form>

<hr>
<h3>Gemte oplysninger:</h3>
<p><strong>Navn:</strong> {{ navn }}</p>
<p><strong>Motor:</strong> {{ motor }}</p>
{% endif %}
