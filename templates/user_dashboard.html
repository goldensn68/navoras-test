<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Brugerdashboard – Navoras</title>
</head>
<body>
    <h1>Velkommen, {{ session['user'] }}</h1>
    <a href="{{ url_for('logout') }}">Log ud</a><br><br>

    <h3>Logbog</h3>
    <ul>
        {% for log in logs %}
            <li>{{ log.entry }} – 
            <a href="{{ url_for('edit_log', log_id=loop.index0) }}">Rediger</a></li>
        {% endfor %}
    </ul>
</body>
</html>
