
<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Brugerdashboard – Navoras</title>
</head>
<body>
  <h1>Velkommen, {{ username }}</h1>
  <a href="{{ url_for('logout') }}">Log ud</a><br><br>

  <p><a href="{{ url_for('profile') }}">Se din profil og badges</a></p>

  <h3>Bådoplysninger</h3>
  {% if boat %}
    <p>Navn: {{ boat.name }} – Længde: {{ boat.length }} – Motor: {{ boat.motor }}</p>
  {% else %}
    <p>Ingen båd registreret.</p>
  {% endif %}

  <h3>Logbog</h3>
  <ul>
    {% for log in logs %}
      <li>{{ log.entry }}</li>
    {% endfor %}
  </ul>
</body>
</html>
