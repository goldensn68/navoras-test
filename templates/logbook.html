<form method='post'>
  <label>Titel:</label><br>
  <input name='titel' placeholder='F.eks. Tur til Ærø'><br>
  <label>Beskrivelse:</label><br>
  <textarea name='tekst' placeholder='Beskriv din tur...'></textarea><br><br>
  <button>Tilføj</button>
</form>
{% for entry in logbog %}
<hr>
<h3>{{ entry.titel }}</h3>
<p>{{ entry.tekst }}</p>
{% endfor %}
