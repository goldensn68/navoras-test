<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Login – Navoras</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
        h2 { margin-top: 0; }
        input { display: block; margin: 10px 0; padding: 10px; width: 100%; }
        button { padding: 10px 20px; background: #0055aa; color: white; border: none; cursor: pointer; }
        button:hover { background: #003d80; }
    </style>
</head>
<body>
    <form class="login-box" method="post">
        <h2>Log ind</h2>
        <input type="text" name="brugernavn" placeholder="Brugernavn" required>
        <input type="password" name="adgangskode" placeholder="Adgangskode" required>
        <button type="submit">Log ind</button>
    </form>
</body>
</html>
