<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Brugerdashboard – Navoras</title>
</head>
<body>
  <h1>Velkommen, {{ username }}</h1>
  <a href="{{ url_for('logout') }}">Log ud</a><br><br>

  <h3>Point og Badges</h3>
  <p>Point: {{ points }}</p>
  <ul>
    {% for badge in badges %}
      <li>{{ badge }}</li>
    {% endfor %}
  </ul>

  <h3>Logbog</h3>
  <p>Her kommer logbogsdata i næste modul.</p>

  <h3>Vedligeholdelse</h3>
  <p>Her kommer vedligeholdelsesdata i næste modul.</p>
</body>
</html>
